server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    # 连接超时 - 等待客户端请求的时间
    connection-timeout: 20000  # 20秒，这个是连接建立超时，不影响请求处理
    
    # 异步请求超时 - 这个才是关键！
    async-timeout: 1800000     # 30分钟（毫秒）⭐ 添加这个配置
    max-http-post-size: 104857600  # 100MB
    

spring:
  application:
    name: blacklist-test-tool
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blacklist_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    # SQL执行超时时间（秒）
    default-statement-timeout: 600  # 10分钟
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-enums-package: com.blacklist.enums

logging:
  level:
    com.blacklist: debug
    org.springframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

blacklist:
  crypto:
    library-path: /usr/local/lib/libcrypto.so
  export:
    temp-dir: /tmp/blacklist-export

grpc:
  server:
    address: localhost
    port: 50051
